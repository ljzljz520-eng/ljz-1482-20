# 创作工作台一键启动：前端(Vite 产物/Nginx) + API + 长任务 worker + PostgreSQL + MinIO
# 预览与正式通过 APP_ENV、独立数据库/桶、独立回调域名隔离（本文件为本地预览形态）。
services:
  db:
    image: postgres:16-alpine
    container_name: workbench-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench}
      POSTGRES_DB: ${POSTGRES_DB:-workbench_preview}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workbench} -d ${POSTGRES_DB:-workbench_preview}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - workbench-net

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: workbench-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-workbench}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio-secret}
    ports:
      - "${S3_HOST_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - workbench-net

  createbuckets:
    image: minio/mc:RELEASE.2024-08-17T15-40-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-workbench} ${S3_SECRET_KEY:-change-me-minio-secret};
      mc mb --ignore-existing local/${S3_BUCKET:-workbench-preview};
      mc mb --ignore-existing local/workbench-prod;
      mc mb --ignore-existing local/workbench-test;
      echo 'buckets ready';
      "
    networks:
      - workbench-net

  backend:
    build: ./backend
    container_name: workbench-api
    command: ["node", "dist/index.js", "api"]
    environment:
      APP_ENV: ${APP_ENV:-preview}
      PORT: 8000
      API_VERSION: ${API_VERSION:-1.4.0}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-1.4.0}
      BUILD_SHA: ${BUILD_SHA:-local}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-please-change-0123456789}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4173}
      DATABASE_URL: postgres://${POSTGRES_USER:-workbench}:${POSTGRES_PASSWORD:-workbench}@db:5432/${POSTGRES_DB:-workbench_preview}
      AUTO_MIGRATE: "true"
      S3_ENDPOINT: minio
      S3_INTERNAL_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-workbench}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-workbench-preview}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost}
      S3_PUBLIC_PORT: ${S3_PUBLIC_PORT:-9000}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-300}
      QUEUE_LEASE_MS: ${QUEUE_LEASE_MS:-30000}
      QUEUE_HEARTBEAT_MS: ${QUEUE_HEARTBEAT_MS:-10000}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - workbench-net

  worker:
    build: ./backend
    container_name: workbench-worker
    command: ["node", "dist/index.js", "worker"]
    environment:
      APP_ENV: ${APP_ENV:-preview}
      WORKER_NAME: ${WORKER_NAME:-worker-1}
      WORKER_HEALTH_PORT: 9101
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-please-change-0123456789}
      DATABASE_URL: postgres://${POSTGRES_USER:-workbench}:${POSTGRES_PASSWORD:-workbench}@db:5432/${POSTGRES_DB:-workbench_preview}
      S3_ENDPOINT: minio
      S3_INTERNAL_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-workbench}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-workbench-preview}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost}
      S3_PUBLIC_PORT: ${S3_PUBLIC_PORT:-9000}
      QUEUE_LEASE_MS: ${QUEUE_LEASE_MS:-30000}
      QUEUE_HEARTBEAT_MS: ${QUEUE_HEARTBEAT_MS:-10000}
      EXPORT_DELAY_MS: ${EXPORT_DELAY_MS:-0}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - workbench-net

  seed:
    build: ./backend
    container_name: workbench-seed
    command: ["sh", "-c", "node dist/bin/migrate.js up && node dist/bin/seed.js"]
    environment:
      APP_ENV: ${APP_ENV:-preview}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-please-change-0123456789}
      DATABASE_URL: postgres://${POSTGRES_USER:-workbench}:${POSTGRES_PASSWORD:-workbench}@db:5432/${POSTGRES_DB:-workbench_preview}
      S3_ENDPOINT: minio
      S3_INTERNAL_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-workbench}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-workbench-preview}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - workbench-net

  frontend:
    build: ./frontend
    container_name: workbench-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - workbench-net

volumes:
  db-data:
  minio-data:

networks:
  workbench-net:
    driver: bridge
